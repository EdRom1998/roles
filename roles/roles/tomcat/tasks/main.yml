---
- name: Install Tomcat
  apt:
    name: tomcat9
    state: present

- name: Ensure Tomcat is started and enabled
  service:
    name: tomcat9
    state: started
    enabled: yes

- name: Sync WAR directly from maven to tomcat
  synchronize:
    src: /opt/edu_ansible/target/JenkinsWar.war
    dest: /var/lib/tomcat9/webapps/JenkinsWar.war
    mode: push
  delegate_to: maven
  notify: restart tomcat
