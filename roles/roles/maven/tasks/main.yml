---
- name: Install dependecies
  apt:
    name:
      - maven
      - git
      - python
    state: present

- name: Clean build dir
  file:
    path: /opt/edu_ansible
    state: absent

- name: Create build dir
  file:
    path: /opt/edu_ansible
    state: directory

- name: Clone repo
  git:
    repo: https://github.com/sivajavatechie/JenkinsWar
    dest: /opt/edu_ansible

- name: Build WAR
  shell: |
    cd /opt/edu_ansible
    mvn package -DskipTests

- name: Sync WAR directly from maven to tomcat
  synchronize:
    src: /opt/edu_ansible/target/JenkinsWar.war
    dest: /var/lib/tomcat9/webapps/JenkinsWar.war
    mode: push
  delegate_to: maven